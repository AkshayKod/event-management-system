<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dream Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            background-color: #f0f2f5;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(135deg, #800040, #ff4d94);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 5px 0;
            border-radius: 8px;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255,255,255,0.2);
        }
        .sidebar .logout {
            margin-top: auto;
            background: rgba(0,0,0,0.2);
            text-align: center;
            cursor: pointer;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #333;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .stat-card h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 600;
            color: #800040;
        }
        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .table-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fdfdfd;
        }
    </style>
    <script>
        // Simple auth check
        if (!sessionStorage.getItem('isAdminLoggedIn')) {
            window.location.href = "admin.html";
        }

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = "admin.html";
        }
    </script>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#" class="active">Bookings</a>
        <a href="#">Reviews</a>
        <a href="#">Settings</a>
        <a onclick="logout()" class="logout">Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Dashboard Overview</h1>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <div class="value" id="totalBookings">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Events</h3>
                <div class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Revenue</h3>
                <div class="value">$$$</div>
            </div>
        </div>

        <div class="table-container">
            <h2>Recent Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Event Type</th>
                        <th>Venue</th>
                        <th>Timings</th>
                        <th>Requirements</th>
                        <th>Date From</th>
                        <th>Date To</th>
                    </tr>
                </thead>
                <tbody id="bookingTable">
                    <tr><td colspan="9" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchBookings() {
            try {
                const response = await fetch('http://localhost:5000/api/bookings');
                const data = await response.json();

                const tableBody = document.getElementById("bookingTable");
                tableBody.innerHTML = "";
                
                document.getElementById("totalBookings").innerText = data.length;

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">No bookings found.</td></tr>';
                    return;
                }

                data.forEach(booking => {
                    const row = `<tr>
                        <td>${booking.name}</td>
                        <td>${booking.email}</td>
                        <td>${booking.phone}</td>
                        <td>${booking.eventType || '-'}</td>
                        <td>${booking.venue || '-'}</td>
                        <td>${booking.timings || '-'}</td>
                        <td>${booking.requirements || '-'}</td>
                        <td>${booking.fromdate}</td>
                        <td>${booking.todate}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
                document.getElementById("bookingTable").innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">Failed to load data.</td></tr>';
            }
        }

        fetchBookings();
    </script>
</body>
</html>
