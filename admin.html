<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function authenticate() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch('http://localhost:5000/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Set a simple sessionStorage token
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    // Redirect to admin report page
                    window.location.href = "view_adminreport.html";
                } else {
                    alert(result.error || "Invalid username or password.");
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("Server error. Ensure backend is running.");
            }
        }
    </script>
    <style>
        .container{
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Admin Login</h2>
        <form onsubmit="event.preventDefault(); authenticate();">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
